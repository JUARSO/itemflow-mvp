    <app-form-modal
      [isOpen]="isOpen()"
      [title]="editing() ? 'Editar miembro' : 'Crear cuenta de miembro'"
      (dismissed)="closed.emit()">

      <form body [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <app-form-field label="Nombre completo" [required]="true">
          <input type="text" formControlName="displayName" />
        </app-form-field>

        <app-form-field label="Correo electrónico" [required]="true">
          <input
            type="email"
            formControlName="email"
            [readOnly]="!!editing()"
            class="mono" />
        </app-form-field>

        <app-form-field label="Rol" [required]="true" hint="Define qué pantallas y acciones puede usar el miembro">
          <select formControlName="role">
            <option value="admin">Administrativo (acceso completo)</option>
            <option value="produccion">Producción (catálogo, inventario, compras, análisis)</option>
            <option value="ventas">Ventas (clientes y pedidos)</option>
          </select>
        </app-form-field>

        @if (!editing()) {
          <app-form-field label="Contraseña temporal" [required]="true"
            hint="El miembro entra con este correo y contraseña; podrá cambiarla luego.">
            <input type="text" formControlName="password" autocomplete="off" placeholder="Mínimo 6 caracteres" />
          </app-form-field>

          <p class="hint-block">
            Solo el administrador puede crear cuentas de Ventas o Producción. La cuenta se crea de
            inmediato; comparte el correo y la contraseña temporal con la persona.
          </p>
        }
      </form>

      <div footer>
        <ion-button fill="clear" class="ghost" (click)="closed.emit()" [disabled]="saving()">Cancelar</ion-button>
        <ion-button (click)="onSubmit()" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Guardando…' : (editing() ? 'Guardar cambios' : 'Crear cuenta') }}
        </ion-button>
      </div>
    </app-form-modal>
